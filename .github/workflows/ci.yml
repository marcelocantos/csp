name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # --- macOS + Linux: Makefile-based build + test ---
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS arm64
          - os: ubuntu-24.04
            name: Linux x86_64
            make_cxx: 'CXX="clang++-18 -std=c++20 -stdlib=libc++"'
            packages: clang-18 libc++-18-dev libc++abi-18-dev gdb
          - os: ubuntu-24.04-arm
            name: Linux arm64
            make_cxx: 'CXX="clang++-18 -std=c++20 -stdlib=libc++"'
            packages: clang-18 libc++-18-dev libc++abi-18-dev gdb

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install dependencies
        if: matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
          sudo sysctl -w kernel.core_pattern=core.%p

      - name: Build and test (source)
        run: |
          ulimit -c unlimited
          make ${{ matrix.make_cxx || '' }}
        env:
          MALLOC_CHECK_: ${{ runner.os == 'Linux' && '3' || '' }}
          MALLOC_PERTURB_: ${{ runner.os == 'Linux' && '42' || '' }}

      - name: GDB backtrace on crash (source)
        if: failure() && runner.os == 'Linux'
        run: |
          for core in core.*; do
            [ -f "$core" ] || continue
            echo "=== Backtrace from $core ==="
            gdb -batch -ex "thread apply all bt full" ./build/normal/csp_tests "$core" 2>&1 || true
          done
          if ! ls core.* 1>/dev/null 2>&1; then
            echo "=== No core dump found, re-running under GDB ==="
            gdb -batch \
              -ex "handle SIGUSR1 nostop noprint pass" \
              -ex "handle SIGUSR2 nostop noprint pass" \
              -ex "handle SIG32 nostop noprint pass" \
              -ex "set pagination off" \
              -ex "run" \
              -ex "thread apply all bt full" \
              --args ./build/normal/csp_tests 2>&1 || true
          fi

      - name: Generate dist
        run: make dist ${{ matrix.make_cxx || '' }}

      - name: Check dist is up-to-date
        run: git diff --exit-code dist/

      - name: Build and test (dist)
        run: |
          ulimit -c unlimited
          make test-dist ${{ matrix.make_cxx || '' }}
        env:
          MALLOC_CHECK_: ${{ runner.os == 'Linux' && '3' || '' }}
          MALLOC_PERTURB_: ${{ runner.os == 'Linux' && '42' || '' }}

      - name: GDB backtrace on crash (dist)
        if: failure() && runner.os == 'Linux'
        run: |
          for core in core.*; do
            [ -f "$core" ] || continue
            echo "=== Backtrace from $core ==="
            gdb -batch -ex "thread apply all bt full" ./build/dist/csp_tests "$core" 2>&1 || true
          done
          if ! ls core.* 1>/dev/null 2>&1; then
            echo "=== No core dump found, re-running under GDB ==="
            gdb -batch \
              -ex "handle SIGUSR1 nostop noprint pass" \
              -ex "handle SIGUSR2 nostop noprint pass" \
              -ex "handle SIG32 nostop noprint pass" \
              -ex "set pagination off" \
              -ex "run" \
              -ex "thread apply all bt full" \
              --args ./build/dist/csp_tests 2>&1 || true
          fi

  # --- Sanitizers (macOS + Linux, on dist) ---
  sanitize:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS ASan+UBSan
            sanitize: address,undefined
          - os: macos-14
            name: macOS TSan
            sanitize: thread
          - os: ubuntu-24.04
            name: Linux x86_64 ASan+UBSan
            sanitize: address,undefined
            make_cxx: 'CXX="clang++-18 -std=c++20 -stdlib=libc++"'
            packages: clang-18 libc++-18-dev libc++abi-18-dev gdb
          - os: ubuntu-24.04
            name: Linux x86_64 TSan
            sanitize: thread
            make_cxx: 'CXX="clang++-18 -std=c++20 -stdlib=libc++"'
            packages: clang-18 libc++-18-dev libc++abi-18-dev gdb
          - os: ubuntu-24.04-arm
            name: Linux arm64 ASan+UBSan
            sanitize: address,undefined
            make_cxx: 'CXX="clang++-18 -std=c++20 -stdlib=libc++"'
            packages: clang-18 libc++-18-dev libc++abi-18-dev gdb
          - os: ubuntu-24.04-arm
            name: Linux arm64 TSan
            sanitize: thread
            make_cxx: 'CXX="clang++-18 -std=c++20 -stdlib=libc++"'
            packages: clang-18 libc++-18-dev libc++abi-18-dev gdb

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install dependencies
        if: matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
          sudo sysctl -w kernel.core_pattern=core.%p

      - name: Build and test (dist, ${{ matrix.sanitize }})
        run: |
          ulimit -c unlimited
          make test-dist SANITIZE=${{ matrix.sanitize }} ${{ matrix.make_cxx || '' }}
        env:
          # mbedTLS triggers false-positive ODR violations under ASan on Linux.
          # libc++abi on Linux frees std::logic_error strings with free()
          # instead of operator delete, triggering false positives under ASan.
          ASAN_OPTIONS: detect_odr_violation=0:alloc_dealloc_mismatch=0

      - name: GDB backtrace on crash
        if: failure() && runner.os == 'Linux'
        run: |
          for core in core.*; do
            [ -f "$core" ] || continue
            echo "=== Backtrace from $core ==="
            gdb -batch -ex "thread apply all bt full" ./build/dist/csp_tests "$core" 2>&1 || true
          done
          if ! ls core.* 1>/dev/null 2>&1; then
            echo "=== No core dump found, re-running under GDB ==="
            gdb -batch \
              -ex "handle SIGUSR1 nostop noprint pass" \
              -ex "handle SIGUSR2 nostop noprint pass" \
              -ex "handle SIG32 nostop noprint pass" \
              -ex "set pagination off" \
              -ex "run" \
              -ex "thread apply all bt full" \
              --args ./build/dist/csp_tests 2>&1 || true
          fi

  # --- Windows: CMake-based build + test ---
  windows:
    name: Windows x86_64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Configure
        run: cmake -B build -DCSP_TLS=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Check exe
        run: dir build\Release\csp_tests.exe

      - name: List tests
        run: |
          & build\Release\csp_tests.exe --list-test-cases 2>&1 | Write-Host

      - name: Test
        run: |
          $ErrorActionPreference = "Continue"
          & build\Release\csp_tests.exe -s --duration 2>&1 | Write-Host
          exit $LASTEXITCODE

  # --- TLA+ model checking (macOS only) ---
  tla:
    name: TLA+ specs
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download TLA+ tools
        run: curl -fsSL -o formal/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

      - name: Run TLC
        run: make check
