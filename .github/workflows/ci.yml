name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/guide/**'
      - 'docs/papers/**'
      - 'docs/reference/**'
      - 'bullseye.yaml'
      - 'docs/_archived/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'STABILITY.md'
  pull_request:
    paths-ignore:
      - 'docs/guide/**'
      - 'docs/papers/**'
      - 'docs/reference/**'
      - 'bullseye.yaml'
      - 'docs/_archived/**'
      - 'README.md'
      - 'CLAUDE.md'
      - 'STABILITY.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # --- macOS + Linux: Makefile-based build + test ---
  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # 45 not 30: the macOS row runs two full builds + two suites (source
    # + dist) and sat within a few minutes of the old ceiling on slow
    # runner days — dying at the JOB timeout preempts the per-test
    # TEST_TIMEOUT watchdog (🎯T29) that would otherwise produce cores
    # and backtraces for a genuine hang.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS arm64
          - os: ubuntu-24.04
            name: Linux x86_64
            make_cxx: 'CXX="clang++-18 -std=c++20 -stdlib=libc++"'
            packages: clang-18 libc++-18-dev libc++abi-18-dev gdb
          - os: ubuntu-24.04-arm
            name: Linux arm64
            make_cxx: 'CXX="clang++-18 -std=c++20 -stdlib=libc++"'
            packages: clang-18 libc++-18-dev libc++abi-18-dev gdb

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: Install dependencies
        if: matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
          sudo sysctl -w kernel.core_pattern=core.%p

      - name: Install macOS dependencies (coreutils for gtimeout)
        if: runner.os == 'macOS'
        run: brew install coreutils

      # 🎯T29: write macOS cores into the workspace (like Linux's
      # core_pattern=core.%p above) so the lldb step below can find them.
      # The 2026-07-07 hang was macOS arm64 `Build and test (dist)` —
      # 24.5 min of silence after the doctest banner, cancelled with no
      # diagnostics because only the Linux arm64 TSan row had a watchdog.
      - name: Enable core dumps (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo sysctl -w kern.coredump=1
          sudo sysctl -w kern.corefile="$PWD/core.%P"

      - name: Build and test (source)
        run: |
          ulimit -c unlimited
          make TEST_TIMEOUT=1200 ${{ matrix.make_cxx || '' }}
        env:
          MALLOC_CHECK_: ${{ runner.os == 'Linux' && '3' || '' }}
          MALLOC_PERTURB_: ${{ runner.os == 'Linux' && '42' || '' }}

      - name: GDB backtrace on crash (source)
        if: failure() && runner.os == 'Linux'
        run: |
          for core in core.*; do
            [ -f "$core" ] || continue
            echo "=== Backtrace from $core ==="
            gdb -batch -ex "thread apply all bt full" ./build/normal/csp_tests "$core" 2>&1 || true
          done
          if ! ls core.* 1>/dev/null 2>&1; then
            echo "=== No core dump found, re-running under GDB ==="
            gdb -batch \
              -ex "handle SIGUSR1 nostop noprint pass" \
              -ex "handle SIGUSR2 nostop noprint pass" \
              -ex "handle SIG32 nostop noprint pass" \
              -ex "set pagination off" \
              -ex "run" \
              -ex "thread apply all bt full" \
              --args ./build/normal/csp_tests 2>&1 || true
          fi

      # 🎯T33: the analyser-driven Small stack-slot selection path is compiled
      # in only under -DCSP_ANALYSE_STACKS (ANALYSE=1). The default `make`
      # above builds the whole tree with it off, so the StackSlotSizing
      # regression test skips there. Build and run once with the gate on so
      # the slot-sizing invariant is actually exercised (meaningful on arm64
      # arena builds; the test self-skips on non-arena builds).
      - name: Build and test (stack analyser enabled)
        run: |
          ulimit -c unlimited
          # Build with the analyser gate on, then run only the slot-sizing
          # suite this step exists to exercise. The rest of the suite already
          # ran under the source build above; re-running all of it here would
          # roughly double per-row wall-time for no added coverage. The
          # ANALYSE build dir is build/normal-analyse (Makefile BUILDDIR).
          make ANALYSE=1 build ${{ matrix.make_cxx || '' }}
          ./build/normal-analyse/csp_tests --no-colors --reporters=console -ts=StackSlotSizing
        env:
          MALLOC_CHECK_: ${{ runner.os == 'Linux' && '3' || '' }}
          MALLOC_PERTURB_: ${{ runner.os == 'Linux' && '42' || '' }}

      # The handlers above hard-code ./build/normal/csp_tests; the ANALYSE step
      # produces a different binary (build/normal-analyse), so a crash there —
      # the exact slot overflow this PR gates — needs its own handler pointed
      # at the right binary, or CI shows a bare non-zero exit with no trace.
      - name: GDB backtrace on crash (stack analyser)
        if: failure() && runner.os == 'Linux'
        run: |
          for core in core.*; do
            [ -f "$core" ] || continue
            echo "=== Backtrace from $core ==="
            gdb -batch -ex "thread apply all bt full" ./build/normal-analyse/csp_tests "$core" 2>&1 || true
          done
          if ! ls core.* 1>/dev/null 2>&1; then
            echo "=== No core dump found, re-running StackSlotSizing under GDB ==="
            gdb -batch \
              -ex "handle SIGUSR1 nostop noprint pass" \
              -ex "handle SIGUSR2 nostop noprint pass" \
              -ex "handle SIG32 nostop noprint pass" \
              -ex "set pagination off" \
              -ex "run" \
              -ex "thread apply all bt full" \
              --args ./build/normal-analyse/csp_tests -ts=StackSlotSizing 2>&1 || true
          fi

      # 🎯T52.2: corpus metric under ANALYSE — Small-slot rate and bytes
      # saved over the full test suite + finite examples, ratcheted BOTH
      # directions against scripts/stack_metric_baseline.json (regression
      # fails; an improvement fails too until the baseline is deliberately
      # updated and committed). Linux arm64 only: on x86_64 the walker is a
      # stub (the rate is structurally 0 until an x86 walker exists — wire a
      # baseline when it does), and the macOS row already runs near its
      # 45-minute ceiling (this step re-runs the full suite under the
      # ANALYSE build); macOS is covered by the local `make stack-metric`
      # gate on the dev machine.
      - name: Stack corpus metric (ANALYSE)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: make ANALYSE=1 stack-metric ${{ matrix.make_cxx || '' }}

      - name: Build examples
        run: make examples ${{ matrix.make_cxx || '' }}

      - name: Run examples
        run: make run-examples-ci ${{ matrix.make_cxx || '' }}

      - name: Generate dist
        run: make dist ${{ matrix.make_cxx || '' }}

      - name: Check dist is up-to-date
        run: git diff --exit-code dist/ include/csp.h

      - name: Build and test (dist)
        run: |
          ulimit -c unlimited
          make test-dist TEST_TIMEOUT=1200 ${{ matrix.make_cxx || '' }}
        env:
          MALLOC_CHECK_: ${{ runner.os == 'Linux' && '3' || '' }}
          MALLOC_PERTURB_: ${{ runner.os == 'Linux' && '42' || '' }}

      - name: GDB backtrace on crash (dist)
        if: failure() && runner.os == 'Linux'
        run: |
          # 🎯T29: test-dist produces more than one csp_tests binary
          # (build/dist and build/dist-notls, for CSP_TLS=1/0), so
          # discover them instead of hardcoding a path that goes stale
          # whenever the BUILDDIR naming scheme shifts.
          bins=$(find build -name csp_tests -type f 2>/dev/null)
          for bin in $bins; do
            for core in core.*; do
              [ -f "$core" ] || continue
              echo "=== Backtrace from $core ($bin) ==="
              gdb -batch -ex "thread apply all bt full" "$bin" "$core" 2>&1 || true
            done
          done
          if ! ls core.* 1>/dev/null 2>&1; then
            echo "=== No core dump found, re-running under GDB ==="
            for bin in $bins; do
              echo "=== $bin ==="
              gdb -batch \
                -ex "handle SIGUSR1 nostop noprint pass" \
                -ex "handle SIGUSR2 nostop noprint pass" \
                -ex "handle SIG32 nostop noprint pass" \
                -ex "set pagination off" \
                -ex "run" \
                -ex "thread apply all bt full" \
                --args "$bin" 2>&1 || true
            done
          fi

      # 🎯T29: macOS counterpart of the GDB steps. TEST_TIMEOUT's SIGQUIT
      # cores the hung test process into the workspace (kern.corefile set
      # above); pair every core with every discovered binary — lldb on a
      # mismatched pair just errors and moves on.
      - name: LLDB backtrace on crash (macOS)
        if: failure() && runner.os == 'macOS'
        run: |
          bins=$(find build -name csp_tests -type f 2>/dev/null)
          found=0
          for core in core.*; do
            [ -f "$core" ] || continue
            found=1
            for bin in $bins; do
              echo "=== Backtrace from $core ($bin) ==="
              lldb --batch -o "bt all" -o quit "$bin" -c "$core" 2>&1 || true
            done
          done
          [ "$found" -eq 1 ] || echo "No core dumps found in workspace."

  # --- Sanitizers (macOS + Linux, on dist) ---
  sanitize:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # 🎯T29: every row caps the suite (test_timeout) well under the
          # 30-minute job timeout so a hang cores (SIGQUIT — see the
          # TEST_TIMEOUT comment in Makefile for why not SIGABRT) and
          # fails the step with a backtrace, instead of running out the
          # clock and getting a diagnostics-free cancel. Hangs have hit
          # the dist suite on Linux arm64 TSan (2026-06-30) AND on plain
          # macOS arm64 (2026-07-07), so the watchdog is on all rows,
          # both jobs.
          - os: macos-14
            name: macOS ASan+UBSan
            sanitize: address,undefined
            test_timeout: 1200
          # macOS TSan removed: 50-130x slower than Linux TSan (2-4 hours
          # vs 2 minutes), gets cancelled 80% of the time, and has never
          # caught anything that Linux arm64/x86_64 TSan didn't also find.
          - os: ubuntu-24.04
            name: Linux x86_64 ASan+UBSan
            sanitize: address,undefined
            make_cxx: 'CXX="clang++-18 -std=c++20 -stdlib=libc++"'
            packages: clang-18 libc++-18-dev libc++abi-18-dev gdb
            test_timeout: 1200
          - os: ubuntu-24.04
            name: Linux x86_64 TSan
            sanitize: thread
            make_cxx: 'CXX="clang++-18 -std=c++20 -stdlib=libc++"'
            packages: clang-18 libc++-18-dev libc++abi-18-dev gdb
            test_timeout: 1200
          - os: ubuntu-24.04-arm
            name: Linux arm64 ASan+UBSan
            sanitize: address,undefined
            make_cxx: 'CXX="clang++-18 -std=c++20 -stdlib=libc++"'
            packages: clang-18 libc++-18-dev libc++abi-18-dev gdb
            test_timeout: 1200
          - os: ubuntu-24.04-arm
            name: Linux arm64 TSan
            sanitize: thread
            make_cxx: 'CXX="clang++-18 -std=c++20 -stdlib=libc++"'
            packages: clang-18 libc++-18-dev libc++abi-18-dev gdb
            test_timeout: 1200

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: Install dependencies
        if: matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
          sudo sysctl -w kernel.core_pattern=core.%p

      # 🎯T29: gtimeout for the TEST_TIMEOUT wrapper + workspace cores
      # for the lldb step, mirroring the test job's macOS setup.
      - name: Install macOS dependencies (coreutils for gtimeout)
        if: runner.os == 'macOS'
        run: brew install coreutils

      - name: Enable core dumps (macOS)
        if: runner.os == 'macOS'
        run: |
          sudo sysctl -w kern.coredump=1
          sudo sysctl -w kern.corefile="$PWD/core.%P"

      - name: Build and test (dist, ${{ matrix.sanitize }})
        run: |
          ulimit -c unlimited
          make test-dist SANITIZE=${{ matrix.sanitize }} ${{ matrix.make_cxx || '' }} TEST_TIMEOUT=${{ matrix.test_timeout || '' }}
        env:
          # libc++abi on Linux frees std::logic_error strings with free()
          # instead of operator delete, triggering false positives under ASan.
          ASAN_OPTIONS: alloc_dealloc_mismatch=0
          # detect_deadlocks=0: TSan's deadlock detector keeps its
          # held-lock table per OS THREAD (64 entries), which is
          # incompatible with M:N fiber runtimes — its bookkeeping
          # accumulates across imp migrations until the table overflows
          # (CHECK failed: sanitizer_deadlock_detector.h) and wedges the
          # process. Same class as the per-thread mutex-tracking
          # limitation documented in test/tsan_suppressions.txt.
          # Deadlock assurance comes from the TLA+ specs (formal/) and
          # the test watchdog, not TSan's lock graph.
          TSAN_OPTIONS: suppressions=test/tsan_suppressions.txt detect_deadlocks=0

      - name: Check cancellation publication with instrumented exception_ptr
        if: runner.os == 'Linux' && matrix.sanitize == 'thread'
        run: |
          # libc++ keeps exception_ptr copies in its uninstrumented shared
          # library. libstdc++ exposes those accesses in headers, so TSan can
          # detect a reason read that races with cancellation publication.
          make build CSP_INCLUDE=dist CSP_TLS=0 SANITIZE=thread \
            BUILDDIR=build/cancel-tsan-libstdcxx \
            CC=clang-18 CXX='clang++-18 -std=c++20 -stdlib=libstdc++' \
            TEST_SRCS='test/main.cc test/cancel.test.cc'
          timeout 60 build/cancel-tsan-libstdcxx/csp_tests --no-colors \
            --test-case=cancel-reason-polling-publishes-the-first-reason,concurrent-cancellers-preserve-one-reason
        env:
          TSAN_OPTIONS: halt_on_error=1 detect_deadlocks=0

      - name: GDB backtrace on crash
        if: failure() && runner.os == 'Linux'
        run: |
          # 🎯T29: test-dist's BUILDDIR varies with SANITIZE and CSP_TLS
          # (e.g. build/thread-dist-notls, build/address-undefined-dist),
          # so discover the binary instead of hardcoding a path that goes
          # stale whenever the naming scheme shifts.
          bins=$(find build -name csp_tests -type f 2>/dev/null)
          for bin in $bins; do
            for core in core.*; do
              [ -f "$core" ] || continue
              echo "=== Backtrace from $core ($bin) ==="
              gdb -batch -ex "thread apply all bt full" "$bin" "$core" 2>&1 || true
            done
          done
          if ! ls core.* 1>/dev/null 2>&1; then
            echo "=== No core dump found, re-running under GDB ==="
            for bin in $bins; do
              echo "=== $bin ==="
              gdb -batch \
                -ex "handle SIGUSR1 nostop noprint pass" \
                -ex "handle SIGUSR2 nostop noprint pass" \
                -ex "handle SIG32 nostop noprint pass" \
                -ex "set pagination off" \
                -ex "run" \
                -ex "thread apply all bt full" \
                --args "$bin" 2>&1 || true
            done
          fi

      # 🎯T29: macOS counterpart of the GDB step above.
      - name: LLDB backtrace on crash (macOS)
        if: failure() && runner.os == 'macOS'
        run: |
          bins=$(find build -name csp_tests -type f 2>/dev/null)
          found=0
          for core in core.*; do
            [ -f "$core" ] || continue
            found=1
            for bin in $bins; do
              echo "=== Backtrace from $core ($bin) ==="
              lldb --batch -o "bt all" -o quit "$bin" -c "$core" 2>&1 || true
            done
          done
          [ "$found" -eq 1 ] || echo "No core dumps found in workspace."

  # --- Subset-link DCE check (🎯T23.3) ---
  # Verifies that an external user who picks only some protocol drop-ins
  # ends up with a binary that contains only those protocols' libraries.
  # Each matrix job fetches the matching libraries via vendor-deps.sh,
  # compiles the dist drop-in + a sample, and uses `nm` to assert that
  # other protocols' symbol prefixes (llhttp_, nghttp2_, ngtcp2_, wslay_,
  # ptls_) are absent from the final binary.
  subset-link:
    name: subset-link (${{ matrix.subset }} on ${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        subset: [channels, http, http+ws, quic, full, unreferenced]
        # `platform` MUST be a base axis, not an include-only key. GitHub
        # merges each `include:` entry into every base combination whose
        # *shared* keys match; an entry that shares no key with any base
        # axis therefore matches all of them. With `subset` as the only
        # base axis, the two entries below were both applied to all five
        # rows in order and the Linux one overwrote the macOS one: five
        # jobs, all `on Linux x86_64`, zero macOS (run 32548872740), so
        # the Darwin `ld64 -dead_strip` arm of subset_check.sh was never
        # exercised. Keying each entry on `platform` pins it to its own
        # own rows: 6 subsets × 2 platforms = 12 jobs (🎯T62, 🎯T63).
        platform: [macos, linux]
        include:
          - platform: macos
            os: macos-14
            name: macOS arm64
          - platform: linux
            os: ubuntu-24.04
            name: Linux x86_64
            packages: clang-18 libc++-18-dev libc++abi-18-dev
            cc_override: 'CXX=clang++-18 CC=clang-18'

    steps:
      - uses: actions/checkout@v6
        # Deliberately no `submodules` and no `lfs` — the whole point of
        # this job is to simulate an external user who took only the dist
        # drop-in plus scripts/vendor-deps.sh.

      # Standing oracle for the bash-3.2 class of failure. macOS ships
      # bash 3.2.57 as /bin/bash, but the runner image also has Homebrew
      # bash 5 first on PATH, so `#!/usr/bin/env bash` in the shipped
      # scripts would silently resolve to 5.x and prove nothing. Assert
      # the stock shell really is 3.x (a 4+ /bin/bash would make this job
      # green while testing the wrong thing), syntax-check the scripts an
      # external user runs, then shim 3.2 to the front of PATH for every
      # later step.
      - name: Pin and verify stock bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          ver=$(/bin/bash -c 'printf "%s" "$BASH_VERSION"')
          echo "/bin/bash reports ${ver}"
          case "$ver" in
            3.*) ;;
            *) echo "::error::expected stock /bin/bash 3.x on this runner, got ${ver}"; exit 1 ;;
          esac
          for s in scripts/subset_check.sh scripts/vendor-deps.sh; do
            /bin/bash -n "$s"
            echo "  ✓ bash 3.2 syntax: $s"
          done
          mkdir -p "$RUNNER_TEMP/bash32"
          ln -sf /bin/bash "$RUNNER_TEMP/bash32/bash"
          echo "$RUNNER_TEMP/bash32" >> "$GITHUB_PATH"

      - name: Install Linux dependencies
        if: matrix.packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
          # Make clang-18 the default `cc` / `c++` for the script.
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"

      - name: Run subset_check.sh
        run: |
          echo "env bash -> $(command -v bash) ($(bash --version | head -1))"
          scripts/subset_check.sh "${{ matrix.subset }}"

      # Non-vacuity control (🎯T63). Only `full` and `unreferenced` compile
      # an asserted-absent library into the link; every other subset's
      # absent-assertions hold with or without dead-stripping. Re-link these
      # two WITHOUT dead-stripping and require a leak: the script exits 0
      # only if an absent library leaks, 4 if nothing does (the assertions
      # would not depend on the linker), and non-zero on any build failure,
      # so a broken build can never pass as a working control.
      - name: Negative control — no dead-strip must leak
        if: matrix.subset == 'full' || matrix.subset == 'unreferenced'
        env:
          SUBSET_CHECK_NEGATIVE_CONTROL: '1'
        run: scripts/subset_check.sh "${{ matrix.subset }}"

  # --- Windows: CMake build + abbreviated smoke (not full suite) ---
  # Full csp_tests on Windows hangs under 🎯T39 (Random / scheduler thrash);
  # the authoritative full suite is scripts/win-validate.sh on the local
  # Parallels VM (windows-vm-validated). Cloud still builds with MSVC and
  # runs a curated core smoke (~seconds of tests) so PRs get a fast amd64
  # cross-check without waiting on a hang/timeout. Master ruleset does not
  # require this job; local VM gate remains the merge Windows signal.
  windows:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          lfs: true

      - name: Configure
        run: cmake -B build -DCSP_TLS=OFF

      - name: Build
        run: cmake --build build --config Release

      - name: Check exe
        run: dir build\Release\csp_tests.exe

      - name: Smoke test (core units)
        shell: pwsh
        run: |
          # Single source of filter: scripts/win-ci-smoke.ps1
          .\scripts\win-ci-smoke.ps1 -Exe build\Release\csp_tests.exe


  # --- TLA+ model checking (macOS only) ---
  tla:
    name: TLA+ specs
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Check TLA code correspondence baseline
        run: make check-tla-tags

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Download TLA+ tools
        run: curl -fsSL -o formal/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/latest/download/tla2tools.jar

      - name: Run TLC
        run: make check

  lifeboat:
    name: Lifeboat live browser journey
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Install uv
        uses: astral-sh/setup-uv@v6
      - name: Build the distributed-file consumer
        run: make lifeboat
      - name: Exercise the live simulation on one and four workers
        run: |
          timeout 60 build/lifeboat/lifeboat --self-test --workers 1
          timeout 60 build/lifeboat/lifeboat --self-test --workers 4
      - name: Install Chromium
        run: uv run --with 'playwright==1.60.0' playwright install --with-deps chromium
      - name: Exercise the live browser and backend
        run: uv run demos/lifeboat/journey.py --artifacts "$RUNNER_TEMP/lifeboat-journey"
      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeboat-journey
          path: ${{ runner.temp }}/lifeboat-journey
