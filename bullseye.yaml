    context: 'Post-v0.28.0 strategy for the spawn-time stack analyser, from the 2026-07-29/30 appraisal of docs/reference/stack-analysis.md + docs/stack-analysis-future.md. Diagnosis: the system is sound and well-oracled but capability is ahead of consumption — most real imps stay on Default slots because the type-erased csp::spawn(lambda) trampoline defeats the walker at the front door, so walker-capability investments (the future doc''s priority table) currently move nothing the product can feel. Strategy: (1) repair the two soundness gaps found during review (silent FP/SIMD SP drift; cycle-set silent degradation past 64 on-stack fns — small_ptr_set::insert no-ops at capacity, stack_analysis_arm64.cc:155, and stack_analysis_options::max_call_depth is declared but never consumed); (2) put a real product metric (Small-rate × bytes saved over the examples/test corpus) plus a true-peak watermark oracle in front of the roadmap; (3) attack the trampoline at the template layer (spawn<F> knows the concrete invoke thunk pre-erasure; bound = audited runtime-shell constant + analysis of the user entry); (4) pull analysis off imp stacks (tiered-JIT shape: Default-on-miss + async worker + atomic publish — no deopt needed since Default is always safe), which also dissolves the bootstrap self-analysability constraint down to a thin walkable stub and unlocks third-party code (Zydis, unwind parsers) in the analyser; (5) make the data-dependent path a bounded synchronous pre-scan (value-snapshot resolved targets, fingerprint sub-cache — future doc §11) so the eval VM never runs on imp stacks, with worker-side arena-backed eval structures replacing the std::vector/deque allocations currently on the sync path (eval_iterative, stack_analysis_arm64.cc:1442-1473). The unwind-metadata spike gates the x86_64 route. Cut/deferred from the future doc per the appraisal: §9 tiered budgets (budget magnitude has no consumer — inexact always selects Default; the cycle→0 rationale is unsound), §10 background warm-up (violates the zero-syscall hot-path ethos), §5 jump tables (idiom treadmill; sound as-is via budget; revisit only if the corpus metric implicates switch-heavy entries).'
    origin: 2026-07-29/30 stack-analysis appraisal conversation
    discovered: 2026-07-30
  T52.1:
    name: 'Walker soundness is structural: no silent SP drift and no degraded cycle detection'
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - small_ptr_set insert failure is treated exactly like a detected cycle (budget + is_exact=false); a regression test exercises a >64-deep on-stack chain including the pure tail-call-cycle shape
    - stack_analysis_options::max_call_depth is actually consumed (wired to the on-stack capacity) or removed from the public options — no decorative knobs
    - A closed-world SP-write detector forces is_exact=false for any unmodelled SP-writing encoding, with tests covering FP/SIMD STP/LDP writeback at minimum
    - FP/SIMD and single-register pre/post-index forms are at least recognize-and-refuse; if decoded for tightness, audit fixtures cover them
    - 'docs: the FP/SIMD severity contradiction between reference and future pages is fixed; reference stamp bumped past v0.28.0 (also covering the resolve_indirect_callee change); the §9 tiered-budgets no-consumer resolution and §10 cut are recorded in the future doc'
    - 'Full oracles green: native + TSan + ASan + audit suite'
    context: 'Two gaps found in the 2026-07-30 review. (a) small_ptr_set (stack_analysis_arm64.cc:143-165) caps at 64 and insert() silently no-ops when full, so cycle detection quietly degrades beyond 64 simultaneously-on-stack functions; after v0.28.0''s BR fix follows tail calls, a pure tail-call cycle deeper than 64 distinct fns keeps vsp flat and would spin the evaluator. stack_analysis_options::max_call_depth (=64) is declared and documented but consumed nowhere in the .cc. (b) FP/SIMD STP/LDP writeback forms (STP Q...) are silently ignored, so SP delta drifts wrong-in-either-direction inside an is_exact result — the future doc §3 says as much while the reference page calls it ''rare under-count''; this is a soundness bug, not a tightness improvement. Structural fix: default posture of ''any instruction that writes SP and is not explicitly modelled forces is_exact=false'' — ARM64 can only write SP through a small set of encoding classes (add/sub imm/extended, MOV to/from SP, load/store writeback with Rn=31), so a closed-world SP-write detector makes the invariant robust against future unknown encodings instead of depending on the enumeration staying complete. Decode-for-tightness (§3/§4 proper) is optional beyond the refuse step.'
