    - Existing csp.cpp + csp_globals.cpp drop-in remains unchanged (channels-only users feel zero impact)
    context: |-
      After the failed monolithic-amalgamation attempt (see retired 🎯T22), the chosen design is per-protocol .cpp files with a factory-function API. Mechanism: C++ static linkers drop .o files (and with -ffunction-sections + --gc-sections, individual functions) when no symbol is referenced. A factory like csp::http2::enable() that returns a type-erased protocol_option struct gives the linker per-symbol granularity — calling it makes the http2 TU live (and its nghttp2 refs); not calling it leaves the TU dead and nghttp2 unreferenced. The five rules above are the contract that makes this work. Preserves the "no build-system lock-in" original vision: users still drop-in source files, just N+1 of them instead of 3. Inter-protocol deps (http3 → quic → tls) are explicit symbol references in the .cpp files, so calling http3::enable() automatically pulls quic + tls. Discovered while investigating the C-vs-C++ wall during 🎯T22 (2026-05-04 to 2026-05-06).

