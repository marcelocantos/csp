    - 'Soundness intact: audit suite green incl. painted true-peak gate; full oracles green; spawn-path bench ratios within noise (paired within-epoch, CSP_MAXPROCS 2/8/16)'
    context: 'The dominant cause of Default fallback is a wiring gap, not a walker gap: at the spawn<F> template layer, before type erasure, the concrete invoke thunk''s address and the closure pointer are statically known. Hand those to the analyser as the root and compose the bound: depth = C_shell + analyze(invoke<F>, closure), where C_shell is the runtime''s fixed imp-entry overhead, analysed or measured once and hand-audited. This retroactively multiplies the value of every tightness feature already shipped (data provenance, ADRP, X0-X7 seeding). Depends on T52.2 so the improvement is measured against a recorded baseline.'
    depends_on:
    - T52.2
    origin: subdivide(🎯T52)
    discovered: 2026-07-30
    achieved: 2026-07-31
  T52.4:
    name: 'Stack analysis executes off imp stacks: async worker with Default-on-miss'
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - Cache miss → Default slot immediately + enqueue; a dedicated non-imp worker analyses and publishes atomically; analysis never suspends and never runs on imp stacks
    - The synchronous stub is allocation-free (no BL to malloc — bump/lookup code only), stays exact when walked, and its own stack bound is documented and audited
    - The bootstrap-safe-container constraint is documented as applying only to the stub; the worker may use ordinary containers
    - Tests cover first-spawn (Default) vs steady-state (cached) behaviour; spawn-path bench ratios within noise (paired within-epoch)
    - Full oracles green ×3 + audit suite
    context: 'Tiered-JIT shape, minus deoptimization (Default is unconditionally safe): spawn consults the cache; on miss it takes Default immediately and enqueues the entry for a dedicated runtime-owned worker thread (not an imp — real 8MB stack), which analyses and publishes via atomic swap. First-spawn-per-entry misses Small, which is irrelevant for the density story. This dissolves both bootstrap obligations (analyser frames on 16KB imp stacks; the analyser being in its own walk corpus) down to a thin synchronous stub — cache lookup only — that must remain allocation-free and walkable. Beyond difficulty reduction, this is the unlock for third-party code in the analyser (Zydis, unwind parsers, std:: containers), i.e. the precondition for the x86_64 route.'
    origin: subdivide(🎯T52)
    discovered: 2026-07-30
    achieved: 2026-07-30
  T52.5:
    name: Data-dependent analysis is a bounded synchronous pre-scan with a fingerprint sub-cache; the eval VM never runs on imp stacks
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - Pre-scan resolves CALL_INDIRECT targets with the same segment-bounds gating as the walk, snapshots resolved targets by value, and computes a fingerprint into a per-fn sub-cache ((fn, targets) → result)
    - Sub-cache miss → Default + enqueue carrying the snapshot; the worker replays bytecode against snapshotted values (no reads of live closure memory off the spawn thread)
    - Worker eval state is arena-backed (capped; overflow bails to is_exact=false); no std allocation remains in any imp-stack-resident analysis code
    - Sub-cache is capped with eviction; tests cover distinct-captures-same-layout reuse and pointer-mutation-between-spawns semantics
    - Warm data-path spawn cost measured at ≈ cache-hit cost; numbers recorded
    context: 'Future doc §11 upgraded per the 2026-07-30 discussion. The only part of data-dependent analysis that must run at spawn time is the pre-scan: segment-bounds-checked loads resolving the bytecode''s CALL_INDIRECT offsets against live closure memory. Snapshot the resolved targets BY VALUE into the async request — freeze-at-spawn semantics survive by value-copy — and the worker replays the bytecode against the snapshot on its own stack, publishing into a per-fn sub-cache keyed by the resolved-target fingerprint. The imp-side path becomes lookup + bounded loads + hash: allocation-free, VM-free, trivially walkable; warm data-path spawns hit the sub-cache at ~cache-hit cost (vs ~142ns replay today). Worker-side eval structures (call_stack std::vector, prog_store std::deque, compile outputs — eval_iterative, stack_analysis_arm64.cc:1442-1473 — plus the values[256] native array) move to a capped per-thread arena whose exhaustion bails to inexact (the escape hatch makes small fixed arenas sound). Depends on T52.4 for the worker/publish machinery.'
    depends_on:
    - T52.4
    origin: subdivide(🎯T52)
    discovered: 2026-07-30
    achieved: 2026-07-31
  T52.6:
    name: 'Unwind-metadata frame-size spike: go/no-go recorded'
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - A prototype extracts frame sizes from unwind metadata on macOS and Linux for a sample of corpus functions and compares them against walker results, with discrepancies classified (walker wrong / unwind insufficient / both right)
    - The peak-vs-CFA, alloca-marking, and compact-unwind-coverage questions are answered with data, recorded in docs/stack-analysis-future.md
    - An explicit go/no-go decision is recorded for (a) unwind data as the frame-size source on ARM64 and (b) the unwind-first route for x86_64 — superseding the future doc §8 hand-rolled-decoder plan if go
    context: 'Spike-then-decide. The compiler already emits the SP-delta information the walker reconstructs by decoding instructions — .eh_frame CFI on Linux, compact unwind + DWARF fallback on macOS — maintained by construction, including the FP/SIMD saves the decoder misses. A hybrid (unwind data for per-function frame sizes + a light decoder pass only for call edges) could shrink the x86_64 effort from ''write a variable-length decoder'' to ''parse CFI + find call sites'' and provide defence-in-depth on ARM64. Known risks to probe: peak-SP-within-function vs CFA-derived frame size (outgoing args, mid-function SP motion), alloca/dynamic-alignment marking in CFI, compact-unwind encoding coverage vs DWARF fallback rates on macOS. Runs on the T52.4 worker (unwind parsers are never walkable — another reason T52.4 matters), but the spike itself has no dependency: it is read-only investigation against the existing corpus.'
    origin: subdivide(🎯T52)
    discovered: 2026-07-30
    achieved: 2026-07-30
