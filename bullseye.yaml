    name: The test suite never hangs under TSan — Linux arm64 TSan CI stays within its normal envelope, and any hang is diagnosable
    status: converging
    value: 0.0
    cost: 0.0
    acceptance:
    - The `Linux arm64 TSan` CI job completes within its normal envelope (historically ~2 min; treat >10 min as a hang) across a sustained window of 20+ consecutive master runs, with zero timeout-cancellations.
    - 'The intermittent hang is root-caused: a local/CI reproduction (e.g. looping the dist TSan test suite for N iterations on arm64) reliably triggers it, and the specific deadlock/livelock site in the scheduler / channel runtime is identified.'
    - A fix lands and the reproduction no longer hangs over a long iteration run.
    - 'CI captures a diagnostic on hang: the dist-TSan test step runs under a watchdog (e.g. `timeout` shorter than the job cap, sending SIGQUIT / triggering a gdb all-thread backtrace) so a future hang yields a stack trace instead of a bare `cancelled` step.'
    context: |-
      Discovered 2026-06-30 on PR #82 (a pure-data hygiene.yaml change): the `Linux arm64 TSan` job hung 30m17s and was cancelled by the job's `timeout-minutes: 30`. The hang was in the `Build and test (dist, thread)` step — `Set up job`, checkout, and `Install dependencies` all succeeded; `GDB backtrace on crash` was skipped (a timeout-cancellation is not a `failure()`, so no stack was captured). A re-run passed.

      --- Analytic scan (2026-07-05, Fable): docs/papers/32-arm64-tsan-hang-analysis.md ---
      Whole-protocol read of the scheduler sleep/wake surface with happens-before arguments. Audited SOUND: worker park/unpark (Note FLAGGED + parked + has_work recheck under global_mu ordering), channel suspend/wake (suspending_ set before unlock_all; wake_pending_ drained under global_mu), Note state machine, quiescence_scope cv handshake, TSan fiber wiring, TLS-noinline coverage (🎯T16 class closed), park_cv notify discipline (terminal notifies fenced). The per-protocol TLA specs verify these under SC in isolation; the bug, if protocol-level, lives below the fence layer or between specs.

      Ranked candidates (paper 32):
      - C1 (PRIMARY): watchdog add_processor congestion cascade under TSan — 10ms heartbeat interval calibrated for uninstrumented speed; TSan slows worker_loop iterations past it; mn.test.cc:647-720 watchdog stress tests deliberately busy-spin workers 200ms–2000ms with set_maxprocs(2) → churn to max_procs_=4×hw (16 threads on 4-core runner) → TSan runtime-lock thrash feedback loop. A congestion collapse, not a deadlock — fits 30min-vs-2min, rarity, re-run-green, pure-data trigger, arm64 specificity.
      - C2: dual time-advancer (fake_clock::run loop × lazily-registered main_loop hook, clock.cc:56-68/113-119) — double-advance / early loop exit / hook busy-spin shapes; needs composite TLA model, not a blind fix.
      - C3: fake_clock::advance() writes current_ without mu_ (clock.cc:90-93) — real race, cheap fix, attribution-neutral.
      - C4: test-side real-time waits — subsumed by C1.
      - C5: narrow hole below/between specs — honest residue; promote if first watchdog capture shows futex-wait deadlock instead of C1's thread storm.
      Discriminator: watchdog's `thread apply all bt` — C1 ≈16 csp-N threads runnable; deadlock = 2–3 threads all in futex/cv waits.
      Iterate against the local repro loop (`make docker-test-arm64 SANITIZE=thread` × N, wall-time distribution + num_procs_ high-water) and TLC — never against CI re-runs.

      --- Watchdog (IMPLEMENTED 2026-07-05 on branch t29-tsan-hang-watchdog; satisfies acceptance criterion 4 when merged) ---
      Mechanism: a hang manifests as a diagnosable step *failure* (with a core) instead of a job-level `cancelled`; the `failure()`-gated GDB steps backtrace it.
      1. Makefile: opt-in `TEST_TIMEOUT` (seconds); when set (and a timeout binary exists), the `test` recipe runs `timeout -s QUIT --kill-after=60 $(TEST_TIMEOUT) ./$(TARGET)`. SIGQUIT, NOT SIGABRT: empirical validation showed doctest installs a SIGABRT handler (vendor/include/doctest/doctest.h:4785-4790 signalDefs) that catches the signal, prints a graceful summary, and exits — NO core. SIGQUIT is absent from doctest's signalDefs, untouched by TSan, unused in csp → kernel default: terminate + core of all threads. Validated: with QUIT the process dies raw mid-run (no doctest summary), recipe fails Error 124.
      2. ci.yml: `test_timeout: 1200` on the `Linux arm64 TSan` matrix row only (20 min < the 30-min job cap); propagates through the recursive test-dist sub-make via command-line variable inheritance (validated with make -n).
      3. Both GDB backtrace steps (test job dist + sanitize job) now discover binaries via `find build -name csp_tests -type f` and loop binary × core — fixes the stale hardcoded `./build/dist/csp_tests` (real dist-TSan binary is `build/thread-dist-notls/csp_tests`; non-sanitize dist job also produces `build/dist-notls`).
      Remaining for this target: root cause (criteria 2–3, iterate against the local repro loop) and the 20-run CI window (criterion 1).

      --- 2026-07-07 update (paper 32 addendum has the full detail) ---
      Criterion 1: MET — 20 consecutive master runs with the arm64 TSan job in envelope (2:13–2:42), zero timeout-cancellations of that job (7 organic post-#91 + 13 sequential workflow_dispatch top-ups). One dispatched run's *macOS* job was cancelled — see below.
      SECOND HANG EVENT: run 28858231742, `test (macOS arm64)` cancelled at 30m19s — dist CSP_TLS=0 suite printed the doctest banner then nothing for 24.5 min; orphaned csp_tests at cleanup. NOT TSan. Common factor across both hang events = the dist CSP_TLS=0 suite. C1 demoted to (real, now fixed) aggravator; C5 (rare platform-agnostic hang) promoted to primary.
      WATCHDOG STORM ROOT-CAUSED AND FIXED (branch worktree-agent-acba192a8709768fd): stall discriminator miscalibration — one missed 10ms heartbeat tick means mid-slice, not blocked; the watchdog inflated 2–4 proc pools to the 64 cap (~64k threads/suite-run) under TSan AND natively. Fix: 100ms stall hysteresis + rescuable-work gate + reuse-before-add. Oracle: CSP_PROC_HIGH_WATER 64 → 4 across 5 docker arm64 dist-TSan runs (zero adds), suite green, wall unchanged. Two simpler fixes failed validation first (gate alone, reuse alone) — recorded in paper 32.
      HANG REPRODUCED LOCALLY: native macOS dist-notls loop, CSP_MAXPROCS=4, ~1/28 runs — banner-then-silence, exact CI signature. Hunt v2 running with `sample`-based all-thread capture (two samples 2s apart: identical=deadlock, changing=livelock). Five latent flaky TESTS caught by the loop and fixed (AltDead, Mux input-death, SpawnSpawn, cancel-during-I/O, Thread---Yield) — each a criterion-1 window threat.
      CI watchdog extended to ALL dist-capable rows in both jobs + macOS core capture (kern.corefile → workspace) + lldb bt-all steps. Docker image now installs libclang-rt-18-dev (sanitizer runtimes — docker-test SANITIZE=… never worked on a clean image) and llvm-18 (llvm-symbolizer; TSan suppressions silently stop matching without it — frames unsymbolized).
