  T3.4.1:
    name: Stack analyser output drives spawn-time allocation
    status: achieved
    value: 0.0
    cost: 0.0
    acceptance:
    - spawn() consults analyze_stack_depth_cached(F, data) at allocation time
    - StackPool offers a second small slot class (e.g. 8-16 KB) selected when the analyser returns is_exact && max_depth + headroom fits
    - Gated behind CSP_ANALYSE_STACKS for staged rollout; off by default until 🎯T3.4.5 benchmark is green
    - Existing 124 KB slot remains the fallback for inexact results and oversize estimates
    context: |-
      The unblocker for 🎯T3.4. Wired analyse_stack_depth_cached(F, data) into spawn() via a CSP_ANALYSE_STACKS compile-time gate (off by default). StackPool grew a second slot class:

      - StackClass::Default — 124 KB usable (unchanged 128 KB arena slot).
      - StackClass::Small   — 16 KB usable + 4 KB guard, served from a separate arena+free-list keyed off the slot class flag on StackRegion.

      spawn() picks Small when CSP_ANALYSE_STACKS is set AND analyse_stack_depth_cached returns is_exact AND `max_depth * 2 + 2048 + sizeof(Imp) <= small_slot_usable_bytes()` — i.e. 2× headroom plus a 2 KB ABI floor. Otherwise it falls back to Default, so behaviour is unchanged unless callers opt in.

      On non-arena builds (Windows VM, sanitizers) StackPool::small_slot_usable_bytes() returns 0, which naturally fails the gate without any architecture-specific code in spawn(). On non-ARM64 builds the analyser already returns is_exact=false, same result.

      Acceptance criterion progress:
        ✓  spawn() consults analyze_stack_depth_cached(F, data) at allocation time (src/csp.cc).
        ✓  StackPool offers a small slot class (16 KB usable) selected when is_exact && depth + headroom fits.
        ✓  Gated behind CSP_ANALYSE_STACKS for staged rollout; off by default.
        ✓  Existing 124 KB slot remains the fallback for inexact results and oversize estimates.

