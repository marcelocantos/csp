    context: 'Found during 🎯T52.4 oracles, reproduced on the pre-T52.4 tree (not a regression): under ASan + CSP_ANALYSE_STACKS together, the audit''s soundness gate fails for the noop fixture — analyser=0 + frame allowance 256 &lt; high_water=272 with is_exact — because an empty function gets no ASan instrumentation (stays exact) while ASan fattens the runtime-shell frames past the fixed 256-byte allowance. The combination is in no CI row (ASan rows are non-ANALYSE; the ANALYSE row is unsanitized), so nothing is red today. Fix direction: the shell allowance should be measured (the painted-peak shell measurement from 🎯T52.2 gives it directly) rather than a constant, or the audit''s tightness/margin checks should self-scale under CSP_AUDIT_SANITIZED like the existing tightness gating does.'
