  <text x="162" y="24" text-anchor="middle">Handler</text>
  <line x1="162" y1="35" x2="162" y2="230" stroke="#888" stroke-dasharray="5,3"/>
  <rect x="237" y="5" width="49" height="30" rx="4" fill="#e8e8e8" stroke="#888"/>
  <text x="261" y="24" text-anchor="middle">Pipe</text>
  <line x1="261" y1="35" x2="261" y2="230" stroke="#888" stroke-dasharray="5,3"/>
  <rect x="326" y="5" width="78" height="30" rx="4" fill="#e8e8e8" stroke="#888"/>
  <text x="365" y="24" text-anchor="middle">Producer</text>
  <line x1="365" y1="35" x2="365" y2="230" stroke="#888" stroke-dasharray="5,3"/>
  <rect x="443" y="5" width="70" height="30" rx="4" fill="#e8e8e8" stroke="#888"/>
  <text x="479" y="24" text-anchor="middle">Channel</text>
  <line x1="479" y1="35" x2="479" y2="230" stroke="#888" stroke-dasharray="5,3"/>
  <rect x="554" y="5" width="78" height="30" rx="4" fill="#e8e8e8" stroke="#888"/>
  <text x="593" y="24" text-anchor="middle">Consumer</text>
