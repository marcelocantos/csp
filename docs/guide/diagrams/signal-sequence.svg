    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>
  <rect x="23" y="5" width="63" height="30" rx="4" fill="#e8e8e8" stroke="#888"/>
  <text x="55" y="24" text-anchor="middle">Kernel</text>
  <line x1="55" y1="35" x2="55" y2="230" stroke="#888" stroke-dasharray="5,3"/>
