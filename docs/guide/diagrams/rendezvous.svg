<svg viewBox="0 0 331 265" xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="12">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#888"/>
    </marker>
  </defs>
  <rect x="23" y="5" width="63" height="30" rx="4" fill="#e8e8e8" stroke="#888"/>
  <text x="55" y="24" text-anchor="middle">Sender</text>
  <line x1="55" y1="35" x2="55" y2="260" stroke="#888" stroke-dasharray="5,3"/>
  <rect x="127" y="5" width="70" height="30" rx="4" fill="#e8e8e8" stroke="#888"/>
  <text x="162" y="24" text-anchor="middle">Channel</text>
  <line x1="162" y1="35" x2="162" y2="260" stroke="#888" stroke-dasharray="5,3"/>
  <rect x="237" y="5" width="78" height="30" rx="4" fill="#e8e8e8" stroke="#888"/>
  <text x="276" y="24" text-anchor="middle">Receiver</text>
  <line x1="276" y1="35" x2="276" y2="260" stroke="#888" stroke-dasharray="5,3"/>
  <line x1="55" y1="80" x2="162" y2="80" stroke="#333" marker-end="url(#arr)"/>
  <text x="108" y="74" text-anchor="middle" font-size="10">w &lt;&lt; 42 (blocks)</text>
  <text x="55" y="110" text-anchor="middle" fill="#666" font-style="italic" font-size="10">waiting for receiver...</text>
  <line x1="276" y1="140" x2="162" y2="140" stroke="#333" marker-end="url(#arr)"/>
  <text x="219" y="134" text-anchor="middle" font-size="10">r &gt;&gt; n (blocks)</text>
  <line x1="162" y1="170" x2="276" y2="170" stroke="#888" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="219" y="164" text-anchor="middle" font-size="10">n = 42</text>
  <line x1="162" y1="200" x2="55" y2="200" stroke="#888" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="108" y="194" text-anchor="middle" font-size="10">unblocks</text>
  <text x="165" y="230" text-anchor="middle" fill="#666" font-style="italic" font-size="10">Both proceed</text>
</svg>
